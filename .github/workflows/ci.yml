name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall src

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          nyc_mobility:
            target: ci
            outputs:
              ci:
                type: athena
                s3_staging_dir: s3://dummy-ci-bucket/query-results/
                region_name: eu-north-1
                database: nyc_mobility
                schema: nyc_mobility_gold
                threads: 1
          EOF

      - name: Validate dbt project
        working-directory: dbt/nyc_mobility
        run: dbt parse

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: infrastructure
        run: terraform fmt -check

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure
        run: terraform validate